[package]
name = "agentsignals"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# The engine; Skia comes with it (drawnui-skia-safe), used as drawnui::skia. Do not add skia-safe.
drawnui = "0.1.0-preview.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Media_Speech",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"

# Its own workspace: the app builds the same inside or outside another one.
[workspace]
