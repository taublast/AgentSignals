[package]
name = "agentsignals"
version = "0.6.1"
edition = "2024"
publish = false

[dependencies]
# The engine; Skia comes with it (drawnui-skia-safe), used as drawnui::skia. Do not add skia-safe.
drawnui = "0.1.0-preview.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows: voice, toasts, UI Automation, window calls.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Media_Speech",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }

# macOS: Dock icon attention, window raise / floating level, the disabled zoom button (NSButton,
# NSControl, NSView are what NSWindow's standardWindowButton needs), main-thread hops, liveness.
# Sounds, voice, notifications and Terminal tabs go through the system's own programs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSWindow", "NSResponder", "NSButton", "NSControl", "NSView"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSString", "NSError"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "alloc", "bitflags", "block2", "UNUserNotificationCenter", "UNNotificationRequest", "UNNotificationContent", "UNNotificationResponse", "UNNotification", "UNNotificationTrigger", "UNError"] }
block2 = "0.6"
dispatch2 = "0.3"
libc = "0.2"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"

# Its own workspace: the app builds the same inside or outside another one.
[workspace]